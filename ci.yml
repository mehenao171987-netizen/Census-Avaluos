name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Auditoría de dependencias (informativa)
        run: pip install pip-audit && pip-audit -r requirements.txt || echo "Revisar vulnerabilidades reportadas"
